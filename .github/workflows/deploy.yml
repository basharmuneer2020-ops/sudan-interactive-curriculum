name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      # GitHub Pages uses static export, which doesn't support server API routes.
      # Temporarily hide the /api folder during the build; restore after.
      # The chat API is meant for Vercel/server deployments.
      - name: Hide server-only routes for static export
        run: |
          if [ -d "src/app/api" ]; then
            mv src/app/api src/app/_api_disabled_for_static
            echo "Moved src/app/api → src/app/_api_disabled_for_static"
          fi

      - name: Build with Next.js
        run: npm run build:static
        env:
          STATIC_EXPORT: 'true'

      - name: Restore server-only routes
        if: always()
        run: |
          if [ -d "src/app/_api_disabled_for_static" ]; then
            mv src/app/_api_disabled_for_static src/app/api
            echo "Restored src/app/api"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
